<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
}

.signup-page {
    width: 100%;
    min-height: 100vh;
    background-image: url("assets/signup.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}
.signup-container {
    width: 400px;
    max-width: 100%;
    padding: 35px 40px;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(8px);
    border-radius: 18px;
    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.15);
    text-align: center;
}
.signup-container h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 38px;
    font-weight: 400;
    color: #222;
    margin-bottom: 8px;
}

.subtitle {
    font-size: 14px;
    color: #666;
    margin-bottom: 28px;
}
.input-group {
    text-align: left;
    margin-bottom: 17px;
}

.input-group label {
    display: block;
    font-size: 13px;
    color: #333;
    margin-bottom: 7px;
}

.input-group input {
    width: 100%;
    height: 45px;
    padding: 0 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    background: rgba(255, 255, 255, 0.9);
    font-size: 14px;
    transition: 0.3s;
}

.input-group input:focus {
    border-color: #111;
    box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
}
.input-group input::placeholder {
    color: #999;
}
button {
    width: 100%;
    height: 47px;
    margin-top: 5px;
    border: none;
    border-radius: 9px;
    background: #000;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}


button:hover {
    background: #333;

    transform: translateY(-2px);
}

.login-text {
    margin-top: 22px;

    font-size: 13px;

    color: #555;
}

.login-text a {
    color: #000;

    font-weight: bold;

    text-decoration: none;
}

.login-text a:hover {
    text-decoration: underline;
}

@media (max-width: 600px) {

    .signup-page {
        padding: 25px 15px;

        background-position: center top;
    }

    .signup-container {
        width: 100%;

        padding: 28px 25px;

        border-radius: 15px;
    }

    .signup-container h1 {
        font-size: 32px;
    }

    .subtitle {
        margin-bottom: 23px;
    }
}
</style>
<body>

    <div class="signup-page">

        <div class="signup-container">

            <h1>Create Account</h1>

            <p class="subtitle">
                Join us and start your journey
            </p>

            <form>

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your name">
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email">
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password">
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Confirm your password">
                </div>

                <button type="submit">
                    Sign Up
                </button>
                <br><br>
                <a href="forgot_password.html">
                Forgot Password?
                </a>

            </form>

            <p class="login-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

</body>
</html>
