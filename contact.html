<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Café | Contact</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .contact-page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-image: url("assets/contact.jpg");
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            overflow: visible;
            padding-bottom: 70px;
        }

        .contact-page::before {
            content: "";
            position: absolute;
            inset: 0;
            min-height: 100%;
            background: rgba(0, 0, 0, 0.08);
            z-index: 1;
            pointer-events: none;
        }

        .logo {
            position: absolute;
            top: 28px;
            left: 45px;
            z-index: 10;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 68px;
            font-weight: 400;
            line-height: 0.8;
            letter-spacing: -5px;
            color: #fff;
            text-decoration: none;
        }

        nav {
            position: absolute;
            top: 38px;
            right: 45px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 32px;
        }

        nav a {
            position: relative;
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 400;
            transition: 0.3s ease;
        }

        nav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 0;
            height: 1px;
            background: #fff;
            transition: width 0.3s ease;
        }

        nav a:hover::after {
            width: 100%;
        }

        nav a:hover {
            transform: translateY(-2px);
        }

        .contact-content {
            position: relative;
            z-index: 5;
            left: 9%;
            padding-top: 155px;
            width: 590px;
            color: #fff;
            text-align: left;
        }

        .tag {
            display: block;
            margin-bottom: 12px;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
            opacity: 0.9;
        }

        .contact-content h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 64px;
            font-weight: 400;
            line-height: 0.95;
            letter-spacing: -2.5px;
            color: #fff;
            margin-bottom: 18px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        .line {
            width: 55px;
            height: 1px;
            background: #fff;
            margin-bottom: 22px;
            opacity: 0.9;
        }

        .description {
            width: 570px;
            max-width: 100%;
            font-size: 17px;
            line-height: 1.65;
            color: #fff;
            margin-bottom: 25px;
            text-shadow: 0 2px 7px rgba(0, 0, 0, 0.45);
        }

        .contact-details {
            margin-bottom: 22px;
        }

        .detail {
            margin-bottom: 13px;
        }

        .detail span {
            display: block;
            margin-bottom: 3px;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
            opacity: 0.8;
        }

        .detail a,
        .detail p {
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            line-height: 1.4;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .detail a:hover {
            text-decoration: underline;
        }

        .contact-form {
            width: 590px;
            max-width: 100%;
        }

        .form-row {
            display: flex;
            gap: 25px;
            width: 100%;
        }

        .input-group {
            flex: 1;
            margin-bottom: 12px;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.85);
            outline: none;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            padding: 10px 0;
            transition: 0.3s ease;
        }

        .input-group input::placeholder,
        .input-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.9);
        }

        .input-group input:focus,
        .input-group textarea:focus {
            border-bottom-color: #fff;
        }

        .input-group textarea {
            height: 60px;
            resize: none;
        }

        .send-button {
            border: none;
            padding: 11px 25px;
            background: #fff;
            color: #000;
            border-radius: 25px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .send-button:hover {
            background: #000;
            color: #fff;
            transform: translateY(-2px);
        }

        .social-links {
            display: flex;
            gap: 20px;
            margin-top: 18px;
        }

        .social-links a {
            color: #fff;
            text-decoration: none;
            font-size: 11px;
            transition: 0.3s ease;
        }

        .social-links a:hover {
            opacity: 0.55;
        }

        .cart {
            position: fixed;
            right: 25px;
            bottom: 25px;
            z-index: 20;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            text-decoration: none;
            font-size: 11px;
            border-radius: 10px;
            transition: 0.3s ease;
        }

        .cart:hover {
            transform: scale(1.08);
            border-radius: 14px;
        }

        @media (max-width: 900px) {

            .logo {
                left: 30px;
                font-size: 58px;
            }

            nav {
                right: 30px;
                gap: 20px;
            }

            nav a {
                font-size: 13px;
            }

            .contact-content {
                left: 7%;
                padding-top: 145px;
                width: 500px;
            }

            .contact-content h1 {
                font-size: 55px;
            }

            .description {
                width: 100%;
                font-size: 15px;
            }

            .contact-form {
                width: 100%;
            }
        }

        @media (max-width: 600px) {

            .contact-page {
                min-height: 100vh;
                height: auto;
                background-position: center top;
                padding-bottom: 80px;
            }

            .logo {
                top: 20px;
                left: 20px;
                font-size: 45px;
                letter-spacing: -4px;
            }

            nav {
                top: 25px;
                right: 18px;
                gap: 11px;
            }

            nav a {
                font-size: 9px;
            }

            .contact-content {
                left: 8%;
                padding-top: 125px;
                width: 82%;
            }

            .tag {
                font-size: 9px;
                letter-spacing: 2.5px;
                margin-bottom: 9px;
            }

            .contact-content h1 {
                font-size: 42px;
                letter-spacing: -1.5px;
                margin-bottom: 13px;
            }

            .line {
                width: 32px;
                margin-bottom: 15px;
            }

            .description {
                width: 100%;
                font-size: 12px;
                line-height: 1.6;
                margin-bottom: 18px;
            }

            .detail {
                margin-bottom: 10px;
            }

            .detail span {
                font-size: 8px;
                letter-spacing: 2px;
                margin-bottom: 2px;
            }

            .detail a,
            .detail p {
                font-size: 11px;
            }

            .form-row {
                display: flex;
                gap: 15px;
            }

            .input-group {
                margin-bottom: 8px;
            }

            .input-group input,
            .input-group textarea {
                font-size: 11px;
                padding: 7px 0;
            }

            .input-group textarea {
                height: 45px;
            }

            .send-button {
                padding: 8px 17px;
                font-size: 10px;
            }

            .social-links {
                margin-top: 12px;
                gap: 13px;
            }

            .social-links a {
                font-size: 9px;
            }

            .cart {
                width: 45px;
                height: 45px;
                right: 15px;
                bottom: 15px;
                font-size: 10px;
            }
        }

        @media (max-width: 400px) {

            .logo {
                font-size: 40px;
                left: 17px;
            }

            nav {
                right: 14px;
                gap: 7px;
            }

            nav a {
                font-size: 8px;
            }

            .contact-content {
                left: 7%;
                padding-top: 115px;
                width: 84%;
            }

            .contact-content h1 {
                font-size: 36px;
            }

            .description {
                font-size: 10px;
            }

            .detail a,
            .detail p {
                font-size: 10px;
            }
        }

    </style>

</head>

<body>

    <section class="contact-page">

        <a href="index.html" class="logo">
            café
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="signup.html">
                Sign Up
            </a>

            <a href="aboutus.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>

        <div class="contact-content">

            <span class="tag">
                Get In Touch
            </span>

            <h1>
                Contact
            </h1>

            <div class="line"></div>

            <p class="description">
                Have a question, want to reserve a table,
                or simply want to say hello?
                We'd love to hear from you.
            </p>

            <div class="contact-details">

                <div class="detail">

                    <span>
                        Email
                    </span>

                    <a href="mailto:hello@cafe.com">
                        hello@cafe.com
                    </a>

                </div>

                <div class="detail">

                    <span>
                        Phone
                    </span>

                    <a href="tel:+919876543210">
                        +91 98765 43210
                    </a>

                </div>

                <div class="detail">

                    <span>
                        Visit Us
                    </span>

                    <p>
                        12 Coffee Street, Hyderabad
                    </p>

                </div>

            </div>

            <form class="contact-form">

                <div class="form-row">

                    <div class="input-group">

                        <input
                            type="text"
                            placeholder="Your name"
                            required
                        >

                    </div>

                    <div class="input-group">

                        <input
                            type="email"
                            placeholder="Your email"
                            required
                        >

                    </div>

                </div>

                <div class="input-group">

                    <textarea
                        placeholder="Your message"
                        required
                    ></textarea>

                </div>

                <button
                    type="submit"
                    class="send-button"
                >
                    Send Message
                </button>

            </form>

            <div class="social-links">

                <a href="#">
                    Instagram
                </a>

                <a href="#">
                    Facebook
                </a>

            </div>

        </div>

        <a href="#" class="cart">
            cart 0
        </a>

    </section>

</body>

</html>
